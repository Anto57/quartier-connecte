interface=wlo1
driver=nl80211

ssid=Mermoz WiFi gratuit

country_code=FR

hw_mode=g
channel=11

beacon_int=100
dtim_period=2

ieee80211n=1

auth_algs=1

ignore_broadcast_ssid=0

wmm_enabled=1

logger_stdout=-1
logger_stdout_level=2

ctrl_interface=/run/hostapd
ctrl_interface_group=0

# Gestion des appareils bloques par Quartier Connecte
macaddr_acl=0
deny_mac_file=/etc/hostapd/mermoz-deny.conf
